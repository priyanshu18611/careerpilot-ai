name: CareerPilot AI Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  backend-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check Python syntax
        working-directory: backend
        run: |
          python -m py_compile app.py
          python -m py_compile resume_parser.py
          python -m py_compile ats_analyzer.py
          python -m py_compile test_ats_analyzer.py


      - name: Verify application import
        working-directory: backend
        run: |
          python -c "from app import app; print('CareerPilot AI API import successful')"


      - name: Run ATS tests
        working-directory: backend
        run: |
          pytest -v test_ats_analyzer.py
